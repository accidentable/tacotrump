          <h2>What is the TACO Index?</h2>
          <p>The TACO Index (Trump Always Chickens Out) is a real-time dashboard that tracks the probability of Trump backing down on his hardline Iran stance. It analyzes market pressure levels based on 6 key economic indicators: S&amp;P 500, VIX Fear Index, 10-Year Treasury Yield, Oil Prices, Dollar Index, and Presidential Approval Rating.</p>

          <h2>Indicators</h2>
          <ul>
            <li><strong>S&amp;P 500</strong> – Market-cap weighted index of 500 large U.S. companies. Decline signals market instability.</li>
            <li><strong>VIX Fear Index</strong> – S&amp;P 500 options volatility index. Rising VIX indicates growing investor fear.</li>
            <li><strong>10Y Treasury Yield</strong> – U.S. government long-term borrowing cost. Surges add fiscal pressure.</li>
            <li><strong>Oil (WTI)</strong> – West Texas Intermediate crude price. Spikes drive inflationary pressure.</li>
            <li><strong>Dollar Index (DXY)</strong> – Dollar value against 6 major currencies. Sharp drops signal loss of confidence.</li>
            <li><strong>Presidential Approval</strong> – RealClearPolitics polling average. Decline increases political pressure.</li>
          </ul>

          <h2>Risk Levels</h2>
          <ul>
            <li><strong>Lv.1 Safe</strong> – Market stable, policy likely to hold</li>
            <li><strong>Lv.2 Caution</strong> – Some indicators deteriorating, monitoring needed</li>
            <li><strong>Lv.3 Warning</strong> – Multiple indicators worsening, policy change probability rising</li>
            <li><strong>Lv.4 Danger</strong> – Broad market pressure, policy reversal highly likely</li>
          </ul>

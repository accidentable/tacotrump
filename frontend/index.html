          <h2>타코(TACO) 지수란?</h2>
          <p>TACO 지수는 트럼프 행정부의 정책 번복 가능성을 실시간으로 추적하는 대시보드입니다. S&amp;P 500, VIX 공포지수, 10년물 국채금리, 국제유가, 달러 인덱스, 대통령 지지율 등 6가지 핵심 경제 지표를 기반으로 시장 압박 수준을 분석합니다.</p>

          <h2>지표 설명</h2>
          <ul>
            <li><strong>S&amp;P 500</strong> – 미국 대형주 500개 종목의 시가총액 가중 지수. 하락 시 시장 불안 신호.</li>
            <li><strong>VIX 공포지수</strong> – S&amp;P 500 옵션 변동성 기반 지수. 상승 시 투자자 공포 증가.</li>
            <li><strong>10년물 국채금리</strong> – 미국 정부 장기 차입 비용. 급등 시 재정 부담 가중.</li>
            <li><strong>국제유가 (WTI)</strong> – 서부 텍사스산 원유 가격. 급등 시 인플레이션 압력.</li>
            <li><strong>달러 인덱스 (DXY)</strong> – 주요 6개 통화 대비 달러 가치. 급락 시 달러 신뢰 하락.</li>
            <li><strong>대통령 지지율</strong> – RealClearPolitics 기반 여론조사 평균. 하락 시 정치적 압박 증가.</li>
          </ul>

          <h2>위험 단계</h2>
          <ul>
            <li><strong>Lv.1 안전</strong> – 시장 안정, 정책 유지 가능성 높음</li>
            <li><strong>Lv.2 주의</strong> – 일부 지표 악화, 모니터링 필요</li>
            <li><strong>Lv.3 경고</strong> – 다수 지표 악화, 정책 변경 가능성 상승</li>
            <li><strong>Lv.4 위험</strong> – 시장 전반 압박, 정책 번복 가능성 매우 높음</li>
          </ul>

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SweetTACO — Trump Administration Change Odds Dashboard

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        REDIS_URL: !Ref RedisUrl
        KV_URL: !Ref KvUrl
        KV_TOKEN: !Ref KvToken
        VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
        VAPID_SUBJECT: !Ref VapidSubject

Parameters:
  RedisUrl:
    Type: String
    Description: Upstash Redis URL
    NoEcho: true
  KvUrl:
    Type: String
    Description: Upstash Redis REST URL (for pageviews)
    Default: ""
  KvToken:
    Type: String
    Description: Upstash Redis REST token (for pageviews)
    NoEcho: true
    Default: ""
  VapidPrivateKey:
    Type: String
    Description: VAPID private key for Web Push
    NoEcho: true
    Default: ""
  VapidSubject:
    Type: String
    Description: VAPID subject
    Default: "mailto:admin@tacotrump.space"
  DomainName:
    Type: String
    Description: Custom domain name (e.g. tacotrump.space)
    Default: ""
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for CloudFront (us-east-1)
    Default: ""

Resources:
  # ────────────────────────────────────────────────────────
  # HTTP API Gateway
  # ────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "https://tacotrump.space"
          - "http://localhost:5173"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-API-Key
        MaxAge: 86400

  # ────────────────────────────────────────────────────────
  # Public API Lambda Functions
  # ────────────────────────────────────────────────────────
  IndicatorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: indicators.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/indicators
            Method: GET

  RiskLevelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: risk_level.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/risk-level
            Method: GET

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: history.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/history
            Method: GET

  TruthsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: truths.handler
      Timeout: 90
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/truths
            Method: GET

  PageviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: pageviews.handler
      Timeout: 10
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/pageviews
            Method: GET

  PushSubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: push_subscribe.handler
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/push-subscribe
            Method: POST
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/push-subscribe
            Method: DELETE

  # ────────────────────────────────────────────────────────
  # v1 API (API Key Required)
  # ────────────────────────────────────────────────────────
  V1IndicatorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: v1_indicators.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/indicators
            Method: GET

  V1RiskLevelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: v1_risk_level.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/risk-level
            Method: GET

  V1HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: v1_history.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/history
            Method: GET

  # ────────────────────────────────────────────────────────
  # Developer API
  # ────────────────────────────────────────────────────────
  DevRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: dev_register.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/developer/register
            Method: POST

  DevKeysFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: dev_keys.handler
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/developer/keys
            Method: GET
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/developer/keys
            Method: DELETE

  # ────────────────────────────────────────────────────────
  # Cron Job (EventBridge)
  # ────────────────────────────────────────────────────────
  CronCheckLevelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: cron_check_level.handler
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Check TACO risk level change and send push notifications
            Enabled: true

  # ────────────────────────────────────────────────────────
  # S3 Bucket for Frontend
  # ────────────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ────────────────────────────────────────────────────────
  # CloudFront Distribution
  # ────────────────────────────────────────────────────────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3

        Origins:
          # S3 Frontend
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""

          # API Gateway
          - Id: ApiOrigin
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            Compress: true

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution

  FrontendBucketName:
    Description: S3 bucket name for frontend deployment
    Value: !Ref FrontendBucket
